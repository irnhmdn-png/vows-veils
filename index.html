 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vows & Veils - Undangan Digital Premium</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

    .font-latin { font-family: 'Great Vibes', cursive; }
    .font-klasik { font-family: 'Playfair Display', serif; }
    .font-rustic { font-family: 'Lora', serif; } 
    
    .fade-in { animation: fadeIn 1.5s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .spin-slow { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* Efek Kaca Emas */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    
    /* Efek Kaca Hijau/Rustic */
    .glass-rustic {
      background: rgba(241, 245, 240, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(134, 167, 137, 0.3);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.5); border-radius: 10px; }
    
    .rustic-scrollbar::-webkit-scrollbar { width: 6px; }
    .rustic-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
    .rustic-scrollbar::-webkit-scrollbar-thumb { background: rgba(122, 154, 91, 0.5); border-radius: 10px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAOk11TIh_fXKsaBfPw_hijQvP50_KMQ4E",
      authDomain: "vows-veils-digital.firebaseapp.com",
      projectId: "vows-veils-digital",
      storageBucket: "vows-veils-digital.firebasestorage.app",
      messagingSenderId: "84580190584",
      appId: "1:84580190584:web:0ae6f0d125bfaa88bd608d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 1. HALAMAN KATALOG
    // ==========================================
    function HalamanKatalog() {
      const daftarTemplate = [
        { id: "dimas-ayu", nama: "Classic Gold (Premium)", gambar: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", harga: "Rp 150.000" },
        { id: "demo-floral", nama: "Rustic Floral", gambar: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", harga: "Rp 120.000" },
        { id: "demo-minimalis", nama: "Minimalist White", gambar: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", harga: "Rp 99.000" }
      ];

      return (
        <div className="min-h-screen bg-[#0f0f0f] text-white font-klasik pb-20">
          <div className="pt-12 pb-16 text-center border-b border-white/10 px-6">
            <h1 className="text-4xl font-latin text-[#d4af37] mb-2">Vows & Veils</h1>
            <p className="text-sm tracking-widest uppercase text-white/50">Digital Invitation Platform</p>
          </div>
          <div className="max-w-4xl mx-auto px-6 mt-12">
            <h3 className="text-xl mb-8 border-l-4 border-[#d4af37] pl-4">Katalog Desain Premium</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {daftarTemplate.map((item, index) => (
                <div key={index} className="bg-[#1a1a1a] rounded-2xl overflow-hidden border border-white/10 group">
                  <div className="h-64 overflow-hidden relative">
                    <img src={item.gambar} alt={item.nama} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" />
                  </div>
                  <div className="p-6">
                    <h4 className="text-lg font-bold mb-4">{item.nama}</h4>
                    <a href={`?id=${item.id}`} className="block w-full py-3 bg-[#d4af37]/10 text-[#d4af37] text-center rounded-xl text-sm font-bold uppercase tracking-widest hover:bg-[#d4af37] hover:text-black transition">
                      Lihat Demo
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. MESIN UNDANGAN UTAMA (FULL FITUR)
    // ==========================================
    function HalamanUndangan({ clientId }) {
      const [loading, setLoading] = useState(true);
      const [dataKlien, setDataKlien] = useState(null);
      const [isOpened, setIsOpened] = useState(false);
      const [namaTamuURL, setNamaTamuURL] = useState("Tamu Undangan");
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const [timeLeft, setTimeLeft] = useState({ hari: 0, jam: 0, menit: 0, detik: 0 });
      const [namaTamu, setNamaTamu] = useState("");
      const [statusHadir, setStatusHadir] = useState("Hadir");
      const [pesanRSVP, setPesanRSVP] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [daftarUcapan, setDaftarUcapan] = useState([]);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const tamu = urlParams.get('kpd');
        if (tamu) { setNamaTamuURL(tamu); setNamaTamu(tamu); }

        async function tarikData() {
          try {
            const docRef = db.collection("Invitations").doc(clientId);
            const docSnap = await docRef.get();
            if (docSnap.exists) setDataKlien(docSnap.data());
          } catch (err) { console.log(err); } finally { setLoading(false); }
        }
        tarikData();
        
        const unsubscribeRSVP = db.collection(`RSVP_${clientId}`).orderBy("waktu_kirim", "desc").onSnapshot((snapshot) => {
             setDaftarUcapan(snapshot.docs.map(doc => doc.data()));
        });
        
        audioRef.current = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
        audioRef.current.loop = true;

        const targetDate = new Date("2026-09-15T08:00:00").getTime();
        const interval = setInterval(() => {
          const now = new Date().getTime();
          const difference = targetDate - now;
          if (difference > 0) {
            setTimeLeft({
              hari: Math.floor(difference / (1000 * 60 * 60 * 24)),
              jam: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
              menit: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
              detik: Math.floor((difference % (1000 * 60)) / 1000)
            });
          }
        }, 1000);

        return () => { clearInterval(interval); unsubscribeRSVP(); };
      }, [clientId]);

      const bukaUndangan = () => {
        setIsOpened(true);
        audioRef.current.play().then(() => setIsPlaying(true)).catch(e => console.log("Auto-play diblokir"));
      };

      const toggleMusik = () => {
        if (isPlaying) audioRef.current.pause(); else audioRef.current.play();
        setIsPlaying(!isPlaying);
      };

      const salinRekening = () => {
        navigator.clipboard.writeText(dataKlien.bank_rekening || '1234567890').then(() => alert('Berhasil menyalin rekening!'));
      };

      const kirimRSVP = async (e) => {
        e.preventDefault(); 
        if (!namaTamu.trim() || !pesanRSVP.trim()) return alert("Isi form dengan lengkap!");
        setIsSubmitting(true);
        try {
          await db.collection(`RSVP_${clientId}`).add({ nama: namaTamu, status: statusHadir, pesan: pesanRSVP, waktu_kirim: firebase.firestore.FieldValue.serverTimestamp() });
          setPesanRSVP(""); alert("Pesan terkirim!");
        } catch (err) { alert("Gagal mengirim."); } finally { setIsSubmitting(false); }
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center bg-black text-white"><p className="font-klasik animate-pulse">Memuat Momen Indah...</p></div>;
      if (!dataKlien) return <div className="min-h-screen flex items-center justify-center bg-black text-white"><a href="?" className="text-[#d4af37] border-b border-[#d4af37]">Undangan Tidak Ditemukan. Kembali ke Katalog.</a></div>;

      // ==========================================
      // TEMA 1: RUSTIC FLORAL (LENGKAP 100%)
      // ==========================================
      if (dataKlien.tema_desain === "rustic-floral") {
        if (!isOpened) {
          // SAMPUL RUSTIC
          return (
            <div className="min-h-screen bg-cover bg-center flex flex-col items-center justify-center p-6 text-center relative overflow-hidden" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80')" }}>
              <div className="absolute inset-0 bg-[#2d4a22]/60 z-0"></div>
              <div className="relative z-10 flex flex-col items-center w-full max-w-sm glass-rustic p-8 rounded-[2rem] shadow-2xl">
                <p className="text-[#4a5d23] font-rustic text-sm tracking-[0.2em] uppercase mb-4">Pernikahan Dari</p>
                <h1 className="text-6xl font-latin text-[#2d4a22] mb-6">{dataKlien.nama_pria} <br/><span className="text-4xl text-[#7a9a5b]">&amp;</span><br/> {dataKlien.nama_wanita}</h1>
                <div className="mb-8">
                  <p className="text-[#4a5d23] text-sm font-rustic mb-2">Kepada Yth.</p>
                  <p className="text-xl font-bold font-rustic text-[#2d4a22] border-b-2 border-[#7a9a5b] px-4 pb-1 inline-block">{namaTamuURL}</p>
                </div>
                <button onClick={bukaUndangan} className="bg-[#4a5d23] hover:bg-[#38461a] text-[#f1f5f0] font-rustic px-8 py-3 rounded-full text-sm transition shadow-lg w-full">
                  Buka Undangan
                </button>
              </div>
            </div>
          );
        }

        // ISI RUSTIC LENGKAP
        return (
          <div className="min-h-screen bg-[#f1f5f0] text-[#2d4a22] pb-24 fade-in font-rustic relative" style={{ backgroundImage: "url('https://www.transparenttextures.com/patterns/rice-paper-2.png')" }}>
            <div className="max-w-md mx-auto p-6 pt-12">
              
              {/* 1. KUTIPAN & JUDUL */}
              <div className="text-center mb-12">
                <p className="italic text-sm text-[#4a5d23] mb-6 px-4 leading-relaxed">
                  "Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu isteri-isteri dari jenismu sendiri..."
                </p>
                <h2 className="text-5xl font-latin text-[#4a5d23] mb-4">{dataKlien.nama_pria} & {dataKlien.nama_wanita}</h2>
                <div className="w-16 h-[2px] bg-[#7a9a5b] mx-auto"></div>
              </div>

              {/* 2. HITUNG MUNDUR (RUSTIC) */}
              <div className="bg-white rounded-3xl p-6 text-center mb-12 shadow-sm border border-[#86a789]/30 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-[#7a9a5b]"></div>
                <p className="text-xs uppercase tracking-widest text-[#4a5d23] mb-4 font-bold">Menuju Hari Bahagia</p>
                <div className="grid grid-cols-4 gap-2">
                  <div className="bg-[#f1f5f0] p-3 rounded-xl"><span className="block text-xl font-bold">{timeLeft.hari}</span><span className="text-[10px] uppercase text-[#7a9a5b]">Hari</span></div>
                  <div className="bg-[#f1f5f0] p-3 rounded-xl"><span className="block text-xl font-bold">{timeLeft.jam}</span><span className="text-[10px] uppercase text-[#7a9a5b]">Jam</span></div>
                  <div className="bg-[#f1f5f0] p-3 rounded-xl"><span className="block text-xl font-bold">{timeLeft.menit}</span><span className="text-[10px] uppercase text-[#7a9a5b]">Menit</span></div>
                  <div className="bg-[#f1f5f0] p-3 rounded-xl"><span className="block text-xl font-bold">{timeLeft.detik}</span><span className="text-[10px] uppercase text-[#7a9a5b]">Detik</span></div>
                </div>
              </div>

              {/* 3. PROFIL MEMPELAI (RUSTIC) */}
              <div className="glass-rustic rounded-[2rem] shadow-sm p-8 text-center mb-12">
                <p className="text-xs text-[#7a9a5b] uppercase tracking-widest font-bold mb-4">Mempelai Pria</p>
                <h3 className="text-4xl font-latin text-[#2d4a22] mb-2">{dataKlien.nama_pria}</h3>
                <p className="text-sm text-[#4a5d23] mb-8 italic">Putra pertama dari Bpk. Fulan & Ibu Fulanah</p>
                <div className="text-3xl text-[#7a9a5b] mb-8 font-latin">&</div>
                <p className="text-xs text-[#7a9a5b] uppercase tracking-widest font-bold mb-4">Mempelai Wanita</p>
                <h3 className="text-4xl font-latin text-[#2d4a22] mb-2">{dataKlien.nama_wanita}</h3>
                <p className="text-sm text-[#4a5d23] italic">Putri kedua dari Bpk. Fulan & Ibu Fulanah</p>
              </div>

              {/* 4. JADWAL ACARA (RUSTIC) */}
              <div className="bg-white rounded-3xl shadow-sm p-8 text-center mb-12 border border-[#86a789]/30 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-[#7a9a5b]"></div>
                <h3 className="text-2xl font-bold text-[#2d4a22] mb-6">Momen Bahagia</h3>
                <p className="text-sm tracking-widest uppercase text-[#7a9a5b] mb-1">Akad Nikah</p>
                <p className="text-lg mb-4">{dataKlien.waktu_akad}</p>
                <p className="text-sm tracking-widest uppercase text-[#7a9a5b] mb-1">Resepsi</p>
                <p className="text-lg mb-6">{dataKlien.waktu_resepsi}</p>
                <p className="text-sm mb-4 leading-relaxed">{dataKlien.lokasi}</p>
                <a href={dataKlien.link_map} target="_blank" className="inline-block bg-[#2d4a22] text-[#f1f5f0] px-6 py-2 rounded-full text-xs tracking-widest uppercase">Lihat Peta</a>
              </div>

              {/* 5. GALERI FOTO (RUSTIC) */}
              <div className="glass-rustic rounded-[2rem] shadow-sm p-8 mb-12 text-center">
                <h3 className="text-2xl font-bold text-[#2d4a22] mb-6">Galeri Cinta</h3>
                <div className="grid grid-cols-2 gap-4">
                  <div className="h-40 rounded-xl overflow-hidden shadow-sm">
                    <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" className="w-full h-full object-cover hover:scale-105 transition duration-500" alt="Galeri 1" />
                  </div>
                  <div className="h-40 rounded-xl overflow-hidden shadow-sm">
                    <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" className="w-full h-full object-cover hover:scale-105 transition duration-500" alt="Galeri 2" />
                  </div>
                </div>
              </div>

              {/* 6. AMPLOP DIGITAL (RUSTIC) */}
              <div className="bg-white rounded-3xl shadow-sm p-8 mb-12 text-center border border-[#86a789]/30">
                <h3 className="text-2xl font-bold text-[#2d4a22] mb-4">Tanda Kasih</h3>
                <p className="text-sm text-[#4a5d23] mb-6 leading-relaxed">Doa restu Anda merupakan karunia yang sangat berarti bagi kami.</p>
                <div className="bg-[#f1f5f0] p-6 rounded-xl inline-block w-full">
                  <p className="font-bold text-lg">{dataKlien.bank_nama}</p>
                  <p className="text-2xl tracking-widest my-2">{dataKlien.bank_rekening}</p>
                  <p className="text-xs uppercase tracking-widest text-[#7a9a5b] mb-6">a.n {dataKlien.bank_atasnama}</p>
                  <button onClick={salinRekening} className="bg-[#2d4a22] text-[#f1f5f0] px-8 py-3 rounded-full text-xs tracking-widest uppercase w-full">Salin Rekening</button>
                </div>
              </div>

              {/* 7. BUKU TAMU (RUSTIC) */}
              <div className="bg-white rounded-3xl shadow-sm p-8 mb-12 border border-[#86a789]/30">
                <h3 className="text-2xl font-bold text-[#2d4a22] text-center mb-6">Buku Tamu</h3>
                <div className="max-h-64 overflow-y-auto rustic-scrollbar pr-2 mb-6 space-y-3">
                  {daftarUcapan.length > 0 ? daftarUcapan.map((ucapan, idx) => (
                    <div key={idx} className="bg-[#f9fbf8] p-4 rounded-xl border border-[#86a789]/20">
                      <div className="flex justify-between items-center mb-1">
                        <p className="font-bold text-sm text-[#2d4a22]">{ucapan.nama}</p>
                        <span className="text-[9px] uppercase font-bold text-[#7a9a5b] bg-[#e1e9de] px-2 py-1 rounded">{ucapan.status}</span>
                      </div>
                      <p className="text-sm text-[#4a5d23] italic mt-1">"{ucapan.pesan}"</p>
                    </div>
                  )) : <p className="text-center text-sm text-[#7a9a5b]">Belum ada ucapan.</p>}
                </div>
                <form onSubmit={kirimRSVP} className="flex flex-col gap-3 border-t border-[#86a789]/20 pt-6">
                  <input type="text" value={namaTamu} onChange={(e) => setNamaTamu(e.target.value)} className="p-3 rounded-lg bg-[#f1f5f0] border-none focus:ring-2 ring-[#7a9a5b] text-sm" placeholder="Nama Anda" required />
                  <select value={statusHadir} onChange={(e) => setStatusHadir(e.target.value)} className="p-3 rounded-lg bg-[#f1f5f0] border-none focus:ring-2 ring-[#7a9a5b] text-sm">
                    <option value="Hadir">Ya, Saya Hadir</option><option value="Tidak Hadir">Maaf, Tidak Hadir</option>
                  </select>
                  <textarea value={pesanRSVP} onChange={(e) => setPesanRSVP(e.target.value)} className="p-3 rounded-lg bg-[#f1f5f0] border-none focus:ring-2 ring-[#7a9a5b] text-sm h-20" placeholder="Pesan & Doa..." required></textarea>
                  <button type="submit" disabled={isSubmitting} className="bg-[#4a5d23] text-white py-3 rounded-lg text-xs tracking-widest uppercase font-bold">Kirim Pesan</button>
                </form>
              </div>
            </div>

            <button onClick={toggleMusik} className="fixed bottom-6 right-6 z-50 w-12 h-12 bg-[#2d4a22] rounded-full shadow-xl flex items-center justify-center text-white">
              <div className={`text-xl ${isPlaying ? 'spin-slow' : ''}`}>💿</div>
            </button>
          </div>
        );
      }

      // ==========================================
      // TEMA 2: CLASSIC GOLD (LENGKAP 100%)
      // ==========================================
      if (!isOpened) {
        // SAMPUL CLASSIC
        return (
          <div className="min-h-screen bg-cover bg-center flex flex-col items-center justify-center p-6 text-center relative overflow-hidden" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80')" }}>
            <div className="absolute inset-0 bg-black/60 z-0"></div>
            <div className="relative z-10 flex flex-col items-center w-full max-w-sm border border-white/30 p-8 rounded-2xl backdrop-blur-sm bg-white/5 shadow-2xl">
              <p className="text-white/80 font-klasik text-sm tracking-[0.2em] uppercase mb-4">Pernikahan Dari</p>
              <h1 className="text-6xl font-latin text-white mb-6 drop-shadow-md">{dataKlien.nama_pria} <span className="text-[#d4af37]">&amp;</span> {dataKlien.nama_wanita}</h1>
              <div className="mb-8">
                <p className="text-white/70 text-sm font-klasik mb-2">Kepada Yth.</p>
                <p className="text-xl font-bold font-klasik text-white bg-black/40 px-6 py-2 rounded-lg border border-white/20">{namaTamuURL}</p>
              </div>
              <button onClick={bukaUndangan} className="bg-[#d4af37] hover:bg-[#c5a028] text-white font-klasik px-8 py-3 rounded-full text-sm transition shadow-lg w-full">Buka Undangan</button>
            </div>
          </div>
        );
      }

      // ISI CLASSIC LENGKAP
      return (
        <div className="min-h-screen bg-fixed bg-cover bg-center text-slate-800 pb-24 fade-in relative font-klasik" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1469371670807-013ccf25f16a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80')" }}>
          <div className="absolute inset-0 bg-[#fdfbf7]/90 z-0 fixed"></div>
          <div className="relative z-10 max-w-md mx-auto p-6 pt-12">
            
            {/* 1. KUTIPAN & JUDUL */}
            <div className="text-center mb-16">
              <p className="italic text-sm text-slate-500 mb-6 px-4 leading-relaxed">
                "Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu isteri-isteri dari jenismu sendiri..."
              </p>
              <h2 className="text-5xl font-latin text-[#b89551] mb-2">{dataKlien.nama_pria} & {dataKlien.nama_wanita}</h2>
              <div className="w-20 h-[1px] bg-[#d4af37] mx-auto"></div>
            </div>

            {/* 2. HITUNG MUNDUR (CLASSIC) */}
            <div className="glass-card rounded-2xl p-6 text-center mb-12 shadow-md">
              <p className="text-xs uppercase tracking-widest text-[#b89551] mb-4 font-bold">Menuju Hari Bahagia</p>
              <div className="grid grid-cols-4 gap-2 text-slate-800">
                <div className="bg-white/80 p-3 rounded-xl shadow-sm"><span className="block text-xl font-bold">{timeLeft.hari}</span><span className="text-[10px] uppercase text-slate-500">Hari</span></div>
                <div className="bg-white/80 p-3 rounded-xl shadow-sm"><span className="block text-xl font-bold">{timeLeft.jam}</span><span className="text-[10px] uppercase text-slate-500">Jam</span></div>
                <div className="bg-white/80 p-3 rounded-xl shadow-sm"><span className="block text-xl font-bold">{timeLeft.menit}</span><span className="text-[10px] uppercase text-slate-500">Menit</span></div>
                <div className="bg-white/80 p-3 rounded-xl shadow-sm"><span className="block text-xl font-bold">{timeLeft.detik}</span><span className="text-[10px] uppercase text-slate-500">Detik</span></div>
              </div>
            </div>

            {/* 3. PROFIL MEMPELAI (CLASSIC) */}
            <div className="glass-card rounded-[2rem] shadow-xl shadow-[#d4af37]/10 p-8 text-center mb-12">
              <p className="text-xs text-[#b89551] uppercase tracking-widest font-bold mb-4">Mempelai Pria</p>
              <h3 className="text-4xl font-latin mb-2">{dataKlien.nama_pria}</h3>
              <p className="text-sm text-slate-600 mb-8 italic">Putra pertama dari Bpk. Fulan & Ibu Fulanah</p>
              <div className="text-3xl text-[#d4af37] mb-8 font-latin">&</div>
              <p className="text-xs text-[#b89551] uppercase tracking-widest font-bold mb-4">Mempelai Wanita</p>
              <h3 className="text-4xl font-latin mb-2">{dataKlien.nama_wanita}</h3>
              <p className="text-sm text-slate-600 italic">Putri kedua dari Bpk. Fulan & Ibu Fulanah</p>
            </div>

            {/* 4. JADWAL ACARA (CLASSIC) */}
            <div className="bg-[#1a1a1a] text-[#fdfbf7] rounded-[2rem] shadow-2xl p-8 text-center mb-12 border border-[#d4af37]/30">
              <h3 className="text-3xl font-latin text-[#d4af37] mb-8">Jadwal Acara</h3>
              <p className="text-xs tracking-[0.2em] uppercase mb-2 text-[#b89551]">Akad Nikah</p>
              <p className="text-lg mb-6">{dataKlien.waktu_akad}</p>
              <p className="text-xs tracking-[0.2em] uppercase mb-2 text-[#b89551]">Resepsi</p>
              <p className="text-lg mb-6">{dataKlien.waktu_resepsi}</p>
              <p className="text-sm mb-4 leading-relaxed">{dataKlien.lokasi}</p>
              <a href={dataKlien.link_map} target="_blank" className="inline-block bg-[#d4af37] text-white px-6 py-2 rounded-full text-xs tracking-widest uppercase">Buka Peta</a>
            </div>

            {/* 5. GALERI FOTO (CLASSIC) */}
            <div className="glass-card rounded-[2rem] shadow-xl p-8 mb-12 text-center">
              <h3 className="text-3xl font-latin text-[#b89551] mb-6">Galeri Momen</h3>
              <div className="grid grid-cols-2 gap-4">
                <div className="h-40 rounded-xl overflow-hidden shadow-sm">
                  <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" className="w-full h-full object-cover hover:scale-105 transition duration-500" alt="Galeri 1" />
                </div>
                <div className="h-40 rounded-xl overflow-hidden shadow-sm">
                  <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" className="w-full h-full object-cover hover:scale-105 transition duration-500" alt="Galeri 2" />
                </div>
              </div>
            </div>

            {/* 6. AMPLOP DIGITAL (CLASSIC) */}
            <div className="glass-card rounded-[2rem] shadow-xl p-8 mb-12 text-center">
              <h3 className="text-3xl font-latin text-[#b89551] mb-4">Amplop Digital</h3>
              <p className="text-sm text-slate-600 mb-6 leading-relaxed">Doa restu Anda merupakan karunia yang sangat berarti bagi kami.</p>
              <div className="bg-white/60 p-6 rounded-xl border border-[#d4af37]/30 inline-block w-full">
                <p className="font-bold text-lg text-slate-800">{dataKlien.bank_nama}</p>
                <p className="text-2xl tracking-widest text-slate-900 my-2">{dataKlien.bank_rekening}</p>
                <p className="text-xs uppercase tracking-widest text-slate-500 mb-6">a.n {dataKlien.bank_atasnama}</p>
                <button onClick={salinRekening} className="bg-[#1a1a1a] text-white px-8 py-3 rounded-full text-xs tracking-widest uppercase w-full">Salin Rekening</button>
              </div>
            </div>

            {/* 7. BUKU TAMU (CLASSIC) */}
            <div className="glass-card rounded-[2rem] shadow-xl p-8 mb-12">
              <h3 className="text-3xl font-latin text-center text-[#b89551] mb-6">Buku Tamu</h3>
              <div className="max-h-64 overflow-y-auto custom-scrollbar pr-2 mb-8 space-y-4">
                {daftarUcapan.length > 0 ? daftarUcapan.map((ucapan, idx) => (
                  <div key={idx} className="bg-white/60 p-4 rounded-xl border border-[#d4af37]/20 shadow-sm text-left">
                    <div className="flex justify-between items-center mb-2">
                      <p className="font-bold text-sm text-slate-800">{ucapan.nama}</p>
                      <span className={`text-[10px] font-bold px-2 py-1 rounded-full ${ucapan.status === 'Hadir' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{ucapan.status}</span>
                    </div>
                    <p className="text-sm text-slate-700 italic">"{ucapan.pesan}"</p>
                  </div>
                )) : <p className="text-center text-sm text-slate-500 italic py-4">Belum ada ucapan.</p>}
              </div>
              <form onSubmit={kirimRSVP} className="flex flex-col gap-4 border-t border-[#d4af37]/20 pt-6">
                <p className="text-sm font-bold text-center mb-2">Kirim Ucapan Anda</p>
                <input type="text" value={namaTamu} onChange={(e) => setNamaTamu(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-[#d4af37]/30 bg-white/50 focus:outline-none focus:border-[#d4af37] text-sm" placeholder="Nama Anda" required />
                <select value={statusHadir} onChange={(e) => setStatusHadir(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-[#d4af37]/30 bg-white/50 focus:outline-none focus:border-[#d4af37] text-sm">
                  <option value="Hadir">Ya, Saya Hadir</option><option value="Tidak Hadir">Maaf, Tidak Hadir</option>
                </select>
                <textarea value={pesanRSVP} onChange={(e) => setPesanRSVP(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-[#d4af37]/30 bg-white/50 focus:outline-none focus:border-[#d4af37] h-24 resize-none text-sm" placeholder="Berikan ucapan doa restu..." required></textarea>
                <button type="submit" disabled={isSubmitting} className="mt-2 py-3 rounded-full text-white tracking-widest text-xs uppercase font-bold bg-[#d4af37] hover:bg-[#b89551]">Kirim Pesan</button>
              </form>
            </div>

          </div>
          <button onClick={toggleMusik} className="fixed bottom-6 right-6 z-50 w-12 h-12 bg-white rounded-full shadow-2xl flex items-center justify-center border border-[#d4af37]/30 hover:scale-110 transition">
            <div className={`text-xl ${isPlaying ? 'spin-slow' : ''}`}>💿</div>
          </button>
        </div>
      );
    }

    // ==========================================
    // 3. PINTU UTAMA
    // ==========================================
    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('id');
      if (clientId) return <HalamanUndangan clientId={clientId} />;
      return <HalamanKatalog />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
